# Firebase App Hosting configuration for KLab Website
# See: https://firebase.google.com/docs/app-hosting/configure
#
# `value:` is read from this file on rollout.
# `secret:` is a name that already exists from the original App Hosting setup
# (RECAPTCHA_SECRET_KEY, EMAIL_PASSWORD). Do not add new secret: keys.

env:
  # Sanity CMS (News/Blog)
  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    value: "mp87vpva"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SANITY_DATASET
    value: production
    availability:
      - BUILD
      - RUNTIME
  # Google reCAPTCHA v2
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: "6LdLzXcsAAAAAB_OSyKHh1KTTWFnhQhYFOfkba3s"
    availability:
      - BUILD
      - RUNTIME
  - variable: RECAPTCHA_SECRET_KEY
    secret: RECAPTCHA_SECRET_KEY
    availability:
      - RUNTIME

  # Email - shared account (user is public; only password is secret)
  - variable: NEXT_PUBLIC_EMAIL_USER
    value: "klab.services@k-lab.ai"
    availability:
      - BUILD
      - RUNTIME
  - variable: EMAIL_PASSWORD
    secret: EMAIL_PASSWORD
    availability:
      - RUNTIME

  # Email - per-form recipients only
  - variable: NEXT_PUBLIC_SALES_RECIPIENT_EMAIL
    value: "sales@k-lab.ai"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPPORT_RECIPIENT_EMAIL
    value: "support@k-lab.ai"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_CAREERS_RECIPIENT_EMAIL
    value: "careers@k-lab.ai"
    availability:
      - BUILD
      - RUNTIME

  # Site and integrations
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://k-lab.ai"
    availability:
      - BUILD
      - RUNTIME

  # Google Analytics
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: "G-J6PXJ44M82"
    availability:
      - BUILD
      - RUNTIME

  # Password gates (Press / POC library)
  - variable: PRESS_PASSWORD
    value: "1010"
    availability:
      - RUNTIME
  - variable: POC_PASSWORD
    value: "2020"
    availability:
      - RUNTIME
